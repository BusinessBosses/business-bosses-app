name: business_bosses_v2
description: A new Flutter project.
publish_to: "none"

version: 3.1.0+93

environment:
  sdk: ">=2.19.2 <4.0.0"

dependencies:
  path_provider: ^2.1.3
  cached_network_image: ^3.2.3
  country_list_pick: ^1.0.1+6
  country_picker: ^2.0.20
  crypto: ^3.0.3
  detectable_text_field: ^3.0.2
  file_picker: ^8.0.0
  firebase_analytics: ^12.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^22.0.1
  flutter:
    sdk: flutter
  flutter_datetime_picker_plus: ^2.1.0
  flutter_dotenv: ^6.0.0
  flutter_linkify: ^6.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_sticky_header: ^0.8.0
  flutter_svg: ^2.0.5
  flutter_swiper_plus: ^2.0.4
  flutter_switch: ^0.3.1
  get: ^4.6.5
  get_storage: ^2.1.1
  google_sign_in: ^7.1.0
  http: ^1.3.0
  image_picker: ^1.0.4
  intl: ^0.20.2
  lottie: ^3.0.0
  photo_manager: ^3.2.0
  pin_code_fields: ^9.1.0
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^8.0.0
  socket_io_client: ^3.0.2
  syncfusion_flutter_charts: ^33.2.7
  text_scroll: ^0.2.0
  timezone: ^0.11.0
  upgrader: ^13.3.0
  url_launcher: ^6.2.4
  uuid: ^4.2.2
  visibility_detector: ^0.4.0+2
  youtube_player_flutter: ^9.0.4
  flutter_speed_dial: ^7.0.0
  purchases_flutter: ^10.1.1
  syncfusion_flutter_calendar: ^33.2.7
  flutter_polls: ^0.1.6
  flutter_downloader: ^1.7.3
  pdfx: ^2.6.0
  fl_chart: ^1.0.0
  flutter_advanced_drawer: ^1.4.0
  flutter_native_splash: ^2.3.7
  share_plus: ^12.0.2
  yaml: any
  app_links: ^7.0.0
  flutter_markdown_plus: ^1.0.3
  firebase_crashlytics: ^5.0.4
  firebase_performance: ^0.11.1+2
  lucide_icons_flutter: 3.1.14+1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_native_splash:
  android: true
  ios: true
  image: "assets/images/logotext.png"
  color: "#FFFFFF"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo_2.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/anim/
    - assets/app/
    - assets/images/
    - assets/svgs/
    - pubspec.yaml
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        # 500 and 800 have no dedicated file. Without these aliases iOS falls
        # back to Regular for them (Android fakes the weight), so w500/w800
        # text rendered bold on Android and thin on iOS.
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 800
        - asset: assets/fonts/NunitoSans-Black.ttf
          weight: 900
