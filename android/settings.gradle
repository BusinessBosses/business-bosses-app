// File: android/settings.gradle

pluginManagement {
    def props = new java.util.Properties()
    def lp = new File(rootDir, "local.properties")
    if (!lp.exists()) throw new GradleException("local.properties not found")
    lp.withReader("UTF-8") { props.load(it) }
    def flutterSdkPath = props.getProperty("flutter.sdk")
    if (flutterSdkPath == null) throw new GradleException("flutter.sdk not set")

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.android.application'   version '8.9.2' apply false
    id 'com.android.library'       version '8.9.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.10' apply false
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id 'com.google.gms.google-services'        version '4.4.2' apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "business-bosses--v2"
include(":app")
